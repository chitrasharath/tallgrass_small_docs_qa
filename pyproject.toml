[project]
name = "doc-qa"
version = "0.1.0"
description = "Question answering over a small folder of messy documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "numpy>=1.26",
    "pdfplumber>=0.11",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
doc-qa-prepare = "doc_qa.prepare:main"
doc-qa-search = "doc_qa.search_cli:main"
doc-qa-eval = "doc_qa.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_qa"]
